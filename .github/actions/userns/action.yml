name: 'Enable Unprivileged User Namespaces'
description: 'Patches the kernel so bwrap/containers work - adds unprivileged_userns_clone sysctl that bypasses the SELinux userns_create hook'

runs:
  using: composite
  steps:
    - name: Patch security_create_user_ns
      shell: bash
      run: python3 ${{ github.action_path }}/patch_security.py

    - name: Add kernel configs for namespace support
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_USER_NS=y
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_OVERLAY_FS=y
